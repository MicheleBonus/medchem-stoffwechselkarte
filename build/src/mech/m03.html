      <span class="id">M-03</span>
      <h3>Biotin und die ATP-abhängige Carboxylierung</h3>
    </div>
    <p class="tafel-sub">Carboxylierungen brauchen ATP, weil CO₂ von sich aus kein guter
    Elektrophil ist. Biotin löst das Problem mit einem aktivierten Zwischenprodukt und einem
    beweglichen Träger. Beide Halbreaktionen sind einzeln ausgeführt.</p>
  </div>

  <figure class="tafel">
    {{T:m03}}
    <figcaption><b>M-03 · Biotin.</b> Das Prinzip des beweglichen Arms kehrt im Stoffwechsel
    mehrfach wieder: beim Liponamid des Pyruvat-Dehydrogenase-Komplexes und beim Phosphopantethein
    der Fettsäure-Synthase. In allen drei Fällen bleibt ein reaktives Zwischenprodukt kovalent
    gebunden und wird zwischen aktiven Zentren transportiert, statt in die Lösung entlassen zu
    werden. Vom Träger ist nur der Bicyclus gezeichnet; „Lys“ steht für die Valeriansäurekette,
    die über eine Amidbindung am Lysin des Enzyms hängt. Der Bicyclus trägt die Konfiguration
    des natürlichen d-Biotins (3aS,4S,6aR): alle drei Ringprotonen stehen cis auf derselben
    Seite. Carboxyliert wird N1′, der Ureidostickstoff am Ringfusionskohlenstoff C6a′, also der
    von der Seitenkette abgewandte. Weil dieser Amid-Stickstoff von sich aus nicht nucleophil
    ist, nimmt ihm das in Zone A freigesetzte Phosphat zuerst sein Proton ab; erst das
    Elektronenpaar der N–H-Bindung wird zur neuen N–C-Bindung. Bei pH 7,4 liegt das Produkt als
    Carbamat-Anion vor, nicht als freie Säure. In Zone C ist das Biotin-Anion selbst die Base,
    die dem Acetyl-CoA das α-Proton abnimmt; Deprotonierung und Carboxylierung laufen deshalb
    praktisch gleichzeitig ab.</figcaption>
  </figure>
