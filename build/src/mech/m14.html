      <span class="id">M-14</span>
      <h3>NO-Synthase: Reduktase- und Oxygenase-Domäne in einer Kette</h3>
    </div>
    <p class="tafel-sub">Die NOS vereint eine Reduktase vom Typ der P450-Reduktase mit einer
    Häm-Oxygenase-Domäne. Die Elektronen müssen dabei die Grenze zwischen zwei Untereinheiten
    überqueren. Deshalb funktioniert nur das Dimer.</p>
  </div>

  <figure class="tafel">
    {{T:m14}}
    <figcaption><b>M-14 · NO-Synthase.</b> Der Vergleich mit <a class="mref" href="#m08">M-08</a>
    zeigt die Verwandtschaft: Beide Systeme führen Elektronen von NADPH über ein Flavinpaar auf ein
    Häm und aktivieren damit Sauerstoff. Beim P450 sitzen Reduktase und Oxygenase in getrennten
    Proteinen, bei der NOS in einer Kette, die dafür dimerisieren muss. Zone A bleibt bewusst ein Schema. Sie zeigt die Anordnung zweier Untereinheiten und keine Bindungen; eine Strukturformel wäre dafür die falsche Darstellungsform. Zone B und C zeigen dagegen echte Strukturen.</figcaption>
  </figure>
