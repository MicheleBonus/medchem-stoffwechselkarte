      <span class="id">M-09</span>
      <h3>Aromatase: dreimal derselbe Zyklus, einmal anders</h3>
    </div>
    <p class="tafel-sub">CYP19A1 entfernt eine Methylgruppe und aromatisiert dabei einen Ring.
    Dafür braucht es drei vollständige P450-Durchgänge, und der dritte verläuft nach einem
    anderen Muster als die ersten beiden.</p>
  </div>

  <figure class="tafel">

    <figcaption><b>M-09 · Aromatase.</b> Derselbe Katalysezyklus wie in
    <a class="mref" href="#m08">M-08</a>, in der letzten Runde aber an einer früheren Stufe
    abgegriffen. Der Unterschied zwischen elektrophilem Compound I und nucleophilem Peroxo-Komplex
    ist der ganze Grund, warum ein gewöhnliches P450 hydroxyliert und dieses hier eine C–C-Bindung

    der axiale Ligand unterscheidet. In Zone B steht stellvertretend für das Steroid nur die
    19-Oxo-Gruppe mit ihrem Nachbarkohlenstoff C10, rechts daneben das tetraedrische Addukt,
