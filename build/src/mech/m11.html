  <div class="spalte">
    <div class="tafel-kopf" id="m11">
      <span class="id">M-11</span>
      <h3>Kupfer-Monooxygenasen: zwei getrennte Kupferzentren</h3>
    </div>
    <p class="tafel-sub">Die Dopamin-β-Hydroxylase und das amidierende Enzym PAM enthalten zwei
    Kupferionen in elf Ångström Abstand, ohne verbindende Aminosäurekette. Der Elektronentransfer
    zwischen ihnen ist bis heute nicht vollständig geklärt.</p>
  </div>

  <figure class="tafel">
    {{T:m11}}
    <figcaption><b>M-11 · Kupfer-Monooxygenasen.</b> Ascorbat wirkt hier weder als Radikalfänger
    noch als Sauerstoffüberträger, sondern schlicht als Elektronendonor, der das Kupfer nach jedem
    Umsatz wieder reduziert. Das ist die zweite, oft übersehene Vitamin-C-Funktion neben der
    Kollagenhydroxylierung. Das Kupfer sitzt in keinem Makrocyclus; es ist deshalb ohne Ebenenbalken gezeichnet, anders als das Häm in <a class="mref" href="#m08">M-08</a> und das Corrin in <a class="mref" href="#m16">M-16</a>. In Zone B setzen beide Fischhaken an der Bindung zum benzylischen Wasserstoff an, also genau an der Stelle, die im Noradrenalin die Hydroxylgruppe trägt; das zweite Sauerstoffatom verlässt den Zyklus beim Rebound als Wasser.</figcaption>
  </figure>
