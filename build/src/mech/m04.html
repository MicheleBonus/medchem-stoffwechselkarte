      <span class="id">M-04</span>
      <h3>Tetrahydrofolat: ein Träger, vier Oxidationsstufen</h3>
    </div>
    <p class="tafel-sub">THF trägt C₁-Einheiten auf vier verschiedenen Oxidationsstufen zwischen
    N5 und N10. Welche Stufe vorliegt, entscheidet darüber, wohin die Einheit gehen kann.
    Zone B zeigt, warum die Thymidylatsynthase den Cofaktor dabei verbraucht.</p>
  </div>

  <figure class="tafel">
    {{T:m04}}
    <figcaption><b>M-04 · Tetrahydrofolat.</b> Der Cofaktor selbst ändert sich nie; nur die
    Oxidationsstufe der transportierten C₁-Einheit wechselt. Gezeichnet ist deshalb nur der
    Ausschnitt zwischen N5 und N10: Pterinring, <i>p</i>-Aminobenzoat und Glutamatschwanz sind in
    allen vier Stufen identisch und stehen als vollständige Struktur in 5.4. Zwei Besonderheiten
    sind die Grundlage des ganzen klinischen Teils: Die Thymidylatsynthase oxidiert den Cofaktor mit und macht
    dadurch die DHFR unentbehrlich, und die MTHFR-Reaktion ist die einzige, die nicht
    zurückläuft.</figcaption>
  </figure>
