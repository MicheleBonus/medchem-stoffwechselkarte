      <span class="id">M-01</span>
      <h3>Pyridoxal-5′-phosphat: ein Cofaktor, vier Reaktionen</h3>
    </div>
    <p class="tafel-sub">Ob dasselbe Coenzym decarboxyliert, transaminiert oder β-eliminiert, bestimmt das Apoenzym
    über den Winkel, in dem es das Substrat festhält. Zone B zeigt diesen Winkel räumlich.</p>
  </div>

  <figure class="tafel">
    {{T:m01}}
    <figcaption><b>M-01 · Pyridoxal-5′-phosphat.</b> Alle drei Reaktionswege teilen sich dasselbe
    chinoide Zwischenprodukt; unterschiedlich ist nur, welche Bindung am Cα das Enzym senkrecht zur
    π-Ebene stellt. Weil sich das in einer flachen Zeichnung nicht sagen lässt, ist die π-Ebene in
    Zone B als Fläche gezeichnet und die brechende Bindung als Keil darauf. Damit erklärt sich, warum
    derselbe Cofaktor in mehreren Kapiteln auftritt: bei der Catecholaminsynthese (2.2), im
    Kynureninweg (2.7), bei GABA (3.1) und bei der Häm-Synthese (3.2).</figcaption>
  </figure>
