      <h3>Glutathionperoxidase: der Selenol-Zyklus</h3>
    </div>
    <p class="tafel-sub">Drei Schritte, zwei Moleküle Glutathion, ein Selenatom, das dreimal seine
    Bindungspartner wechselt. Am Ende hängt alles am NADPH aus dem Pentosephosphatweg.</p>
  </div>

  <figure class="tafel">
    {{T:m17}}
    <figcaption><b>M-17 · Glutathionperoxidase.</b> Der Zyklus verbindet drei Teile dieses Skripts:
    Das Glutathion stammt aus dem Cystein-Ast (3.4), das Selenocystein ist ein Spurenelement-Cofaktor
    (6.1), und das NADPH kommt aus dem Pentosephosphatweg (5.2). Ein Defekt an irgendeiner dieser
    Stellen erzeugt dasselbe klinische Bild. Vom Glutathion ist nur das reagierende Schwefelatom gezeichnet, vom Selenocystein nur das Selen mit seinem Nachbarkohlenstoff. Auf diese beiden Atome läuft der ganze Zyklus hinaus.</figcaption>
  </figure>
