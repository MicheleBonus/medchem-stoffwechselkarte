      <span class="id">M-13</span>
      <h3>Lipoxygenase: dasselbe Substrat, ein anderes Metall</h3>
    </div>
    <p class="tafel-sub">Die 5-LOX startet ebenfalls mit einer Wasserstoffabstraktion, nutzt dafür
    aber kein Tyrosylradikal, sondern ein Nicht-Häm-Eisen. Genau dort greift Zileuton an.</p>
  </div>

  <figure class="tafel">
    {{T:m13}}
    <figcaption><b>M-13 · 5-Lipoxygenase.</b> Der Vergleich mit <a class="mref" href="#m12">M-12</a>
    lohnt sich: Beide Enzyme starten mit einer Wasserstoffabstraktion an einer doppelt allylischen
    Methylengruppe und addieren Sauerstoff auf der Gegenseite. Die Cyclooxygenase erzeugt das dafür
    nötige Radikal an einem Tyrosinrest, die Lipoxygenase an einem Eisenion. Daraus ergeben sich
    zwei getrennte Hemmstoffklassen für dasselbe Substrat. Gezeichnet ist jeweils nur der
    Ausschnitt C4 bis C11 der Kette, darin beide Doppelbindungen der Arachidonsäure in ihrer
    wirklichen <i>cis</i>-Form, das Hydroperoxid des 5-HPETE mit seiner 5<i>S</i>-Konfiguration
    und das Epoxid des LTA<sub>4</sub> als 5<i>S</i>,6<i>S</i>-<i>trans</i>-Epoxid. Vom
    konjugierten Trien des LTA<sub>4</sub> liegen zwei Doppelbindungen im Ausschnitt, die dritte
    (Δ11) fällt dahinter. Das Eisen sitzt in keinem Makrocyclus und ist deshalb ohne
    Ebenenbalken dargestellt.</figcaption>
  </figure>
