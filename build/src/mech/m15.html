      <h3>Vitamin K und die γ-Carboxylierung von Glutamat</h3>
    </div>
    <p class="tafel-sub">Die γ-Carboxylierung verlangt, ein Proton von einem Kohlenstoff
    abzuziehen, der praktisch nicht sauer ist. Woher die dafür nötige Basenstärke kommt, wie das
    Carbanion anschließend Kohlendioxid greift und wo die Cumarine eingreifen.</p>
  </div>

    <figcaption><b>M-15 · Vitamin-K-abhängige γ-Carboxylierung.</b> Der Cofaktor wird hier nicht
    katalytisch regeneriert, sondern bei jedem Umsatz verbraucht und muss enzymatisch zurückgeführt
    werden. Genau deshalb ist die Reduktase der Angriffspunkt: Ein Enzym, das den Cofaktor
    zurückgewinnt, lässt sich wirksamer hemmen als eines, das ihn nur benutzt. Die Peroxid-Zwischenstufe
    zwischen Hydrochinon und Epoxid ist bewusst nicht ausgezeichnet: Ihre genaue Struktur wird in
    der Literatur unterschiedlich dargestellt; prüfungsrelevant ist, dass dabei das Alkoxid
