      <h3>Cyclooxygenase: eine radikalische Kaskade</h3>
    </div>
    <p class="tafel-sub">Wie aus einer offenkettigen Fettsäure in einem einzigen Enzymdurchgang
    ein Bicyclus mit zwei neuen Sauerstoffbrücken wird (sechs Schritte, jeder einzeln gezeichnet),
    und an welcher Stelle Aspirin eingreift.</p>
  </div>

  <figure class="tafel">
    {{T:m12}}
    <figcaption><b>M-12 · Cyclooxygenase.</b> Die gesamte Umwandlung ist eine Radikalkette, die das
    Enzym selbst zündet und die sich am Ende wieder schließt: Das 15-Peroxylradikal holt sich
    das Wasserstoffatom von Tyr385 zurück und stellt damit das Tyrosylradikal für den nächsten
    Durchgang wieder her. Weil alle Schritte im geschlossenen Kanal ablaufen, ist die
    Stereochemie des Produkts vollständig durch die Substratkonformation vorgegeben. Freie
    Radikale in Lösung ergäben ein Produktgemisch. Von den drei Doppelbindungen des gezeigten
    Ausschnitts C7 bis C16 trägt im Bild nur C8=C9 ihre <i>cis</i>-Geometrie; die beiden anderen
    sind der Lesbarkeit halber gestreckt gezeichnet. Die vollständige <i>cis</i>-Anordnung und
    die daraus folgende Haarnadelform stehen in 4.1.</figcaption>
  </figure>
