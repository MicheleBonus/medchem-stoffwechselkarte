      <span class="id">M-05</span>
      <h3>S-Adenosylmethionin: die aktivierte Methylgruppe</h3>
    </div>
    <p class="tafel-sub">Warum der Körper ATP aufwendet, um eine Methylgruppe zu übertragen, die
    im Methionin bereits vorhanden ist, und was geschieht, wenn dieselbe Bindung nicht
    heterolytisch, sondern homolytisch bricht.</p>
  </div>

  <figure class="tafel">
    {{T:m05}}
    <figcaption><b>M-05 · S-Adenosylmethionin.</b> Der ganze Mechanismus folgt aus der positiven Ladung am dreifach substituierten Schwefel: sie polarisiert die C–S-Bindung, macht das Methyl elektrophil und den abgehenden Thioether ungeladen. Beides zusammen erklärt, warum der Körper ATP investiert, obwohl die Methylgruppe im Methionin bereits vorliegt. In Zone A greift der Schwefel deshalb das C5′ der Ribose an und nicht den Phosphor; die drei Phosphate stehen dort verkürzt als PPP. Zone C zeigt dieselbe Verbindung homolytisch gespalten: drei Fischhaken führen das Elektron des reduzierten [4Fe–4S]-Clusters auf den Schwefel, dazu eines der beiden Bindungselektronen ebenfalls auf den Schwefel und das andere auf das C5′, wo es als Punkt stehen bleibt. So entstehen neutrales L-Methionin und dasselbe 5′-Desoxyadenosyl-Radikal wie aus Adenosylcobalamin (<a class="mref" href="#m16">M-16</a>).</figcaption>
  </figure>
