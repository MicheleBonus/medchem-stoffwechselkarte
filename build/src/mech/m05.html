    <div class="tafel-kopf" id="m05">
      <span class="id">M-05</span>
      <h3>S-Adenosylmethionin: die aktivierte Methylgruppe</h3>
    </div>
    <p class="tafel-sub">Warum der Körper ATP aufwendet, um eine Methylgruppe zu übertragen, die
    im Methionin bereits vorhanden ist, und was geschieht, wenn dieselbe Bindung nicht
    heterolytisch, sondern homolytisch bricht.</p>
  </div>

  <figure class="tafel">
    {{T:m05}}
    <figcaption><b>M-05 · S-Adenosylmethionin.</b> Der ganze Mechanismus folgt aus der positiven Ladung am dreifach substituierten Schwefel: sie polarisiert die C–S-Bindung, macht das Methyl elektrophil und den abgehenden Thioether ungeladen. Beides zusammen erklärt, warum der Körper ATP investiert, obwohl die Methylgruppe im Methionin bereits vorliegt. Zone C zeigt, dass dieselbe Verbindung bei den Radikal-SAM-Enzymen homolytisch gespalten wird und dabei dasselbe 5′-Desoxyadenosyl-Radikal liefert wie Adenosylcobalamin (<a class="mref" href="#m16">M-16</a>).</figcaption>
  </figure>
