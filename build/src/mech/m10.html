      <h3>BH₄-abhängige Monooxygenasen und der NIH-Shift</h3>
    </div>
    <p class="tafel-sub">PAH, TH und TPH arbeiten mit einem Nicht-Häm-Eisen. Das Tetrahydrobiopterin
    aktiviert dabei den Sauerstoff, und das eingeführte Hydroxyl schiebt den Wasserstoff zur Seite,
    statt ihn zu verdrängen. Zone B zeichnet diesen Schritt aus.</p>
  </div>

    sofort zurückreduziert, hier trägt es den Sauerstoff selbst heran und wird dabei verbraucht.
    Derselbe Cofaktor, zwei ganz verschiedene Rollen. Statt eines Häms hält hier eine Triade aus zwei Histidinen und einem Glutamat das Eisen; vom Substrat ist in Zone B nur der Aromat mit seinem Rest R gezeichnet. Das σ-Addukt ist dort in der Grenzstruktur gezeichnet, die das Kation neben das sp³-Zentrum stellt, denn nur dorthin kann der Hydridpfeil laufen. In Zone C sind die drei Pterine wirklich drei verschiedene Körper: das Carbinolamin mit der Hydroxylgruppe am C4a, das chinoide Dihydrobiopterin mit zwei Wasserstoffatomen weniger und das zurückgewonnene BH₄.</figcaption>
