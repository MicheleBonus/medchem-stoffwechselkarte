      <span class="id">M-10</span>
      <h3>BH₄-abhängige Monooxygenasen und der NIH-Shift</h3>
    </div>
    <p class="tafel-sub">PAH, TH und TPH arbeiten mit einem Nicht-Häm-Eisen. Das Tetrahydrobiopterin
    aktiviert dabei den Sauerstoff, und das eingeführte Hydroxyl schiebt den Wasserstoff zur Seite,
    statt ihn zu verdrängen. Zone B zeichnet diesen Schritt aus.</p>
  </div>
