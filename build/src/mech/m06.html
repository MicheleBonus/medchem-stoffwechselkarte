      <span class="id">M-06</span>
      <h3>Flavin und die Suizidinhibition der Monoaminoxidase</h3>
    </div>
    <p class="tafel-sub">FAD kann im Gegensatz zu NAD⁺ einzelne Elektronen übertragen. Daraus ergeben sich der
    Wirkmechanismus der irreversiblen MAO-B-Hemmer und der Unterschied zwischen Selegilin,
    Rasagilin und Moclobemid.</p>
  </div>

  <figure class="tafel">
    {{T:m06}}
    <figcaption><b>M-06 · Flavin und die MAO.</b> Der obere Teil zeigt den regulären Zyklus, der
    untere den Verlauf mit Selegilin. Die Propargylgruppe ist dabei Voraussetzung dafür, dass nach
    der Oxidation ein Michael-Akzeptor entsteht, den das nucleophile N5 angreift. Rasagilin trägt
    dieselbe Gruppe an einem Indan-Gerüst statt am Amphetamin-Rest; bei ihm entstehen daher keine
    amphetaminartigen Metaboliten. Vom FAD ist jeweils nur das Isoalloxazin gezeichnet, der
    Ribityl-ADP-Rest als Substituent. Für die Chemie zählt allein der Dreiring mit N5. Ob der
    erste Schritt beim Substrat als Hydridtransfer oder in zwei Ein-Elektronen-Schritten abläuft,
    ist bis heute nicht abschließend geklärt; für die Hemmstoffe ist der Ein-Elektronen-Weg
    belegt.</figcaption>
  </figure>
