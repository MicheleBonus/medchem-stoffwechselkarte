      <span class="id">M-06</span>
      <h3>Flavin und die Suizidinhibition der Monoaminoxidase</h3>
    </div>
    <p class="tafel-sub">FAD kann im Gegensatz zu NAD⁺ einzelne Elektronen übertragen. Daraus ergeben sich der
    Wirkmechanismus der irreversiblen MAO-B-Hemmer und der Unterschied zwischen Selegilin,
    Rasagilin und Moclobemid.</p>
  </div>

  <figure class="tafel">
    {{T:m06}}
    <figcaption><b>M-06 · Flavin und die MAO.</b> Der obere Teil zeigt den regulären Zyklus, der
    untere den Verlauf mit Selegilin. Am Reaktionspfeil der Zone A steht ein Proton: Der
    Hydridtransfer allein liefert zunächst das Flavin-Anion FADH⁻, dessen negative Ladung am N1
    sitzt; erst die Protonierung dort macht daraus FADH₂. Beide Flavine sind deshalb an N5 und N1
    beschriftet. Der gestrichelte Pfeil im Isoalloxazin zeigt den Weg dorthin: Er fasst zusammen,
    wie das Elektronenpaar der Doppelbindung N5=C4a über C4a=C10a auf das N1 ausweicht. Ohne ihn
    hätte das N5 nach der Hydridaufnahme vier Bindungen. Auf der Substratseite verliert das Amin
    ein Hydrid, nicht zwei Wasserstoffatome, und die Hydrolyse des Iminiums setzt neben dem
    Aldehyd auch Ammonium frei. Selegilin ist in
    seiner (R)-Konfiguration gezeichnet; das (S)-Enantiomer ist deutlich schwächer wirksam. Die
    Propargylgruppe ist Voraussetzung dafür, dass nach der Oxidation ein Michael-Akzeptor
    entsteht, den das nucleophile N5 angreift. Das dabei abgespaltene Wasserstoffatom verlässt
    das System nicht, sondern landet am Flavin, wie die Summenformel des gezeichneten Addukts
    zeigt. Rasagilin trägt dieselbe Gruppe an einem Indan-Gerüst statt am Amphetamin-Rest; bei ihm
    entstehen daher keine amphetaminartigen Metaboliten. Vom FAD ist jeweils nur das Isoalloxazin
    gezeichnet, der Ribityl-ADP-Rest als Substituent. Für die Chemie zählt allein das
    Dreiringsystem mit dem N5. Ob der erste Schritt beim Substrat als Hydridtransfer oder in zwei
    Ein-Elektronen-Schritten abläuft, ist bis heute nicht abschließend geklärt; für die
    Hemmstoffe ist der Ein-Elektronen-Weg belegt.</figcaption>
  </figure>
