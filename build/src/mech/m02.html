      <span class="id">M-02</span>
      <h3>Thiaminpyrophosphat und die Umpolung</h3>
    </div>
    <p class="tafel-sub">Ein Carbonylkohlenstoff ist von Natur aus elektrophil. TPP kehrt diese
    Polarität um und macht ihn zum Nucleophil, daher der Name. Alle vier Stufen sind einzeln
    gezeichnet.</p>
  </div>

  <figure class="tafel">
    {{T:m02}}
    <figcaption><b>M-02 · Thiaminpyrophosphat.</b> Der Vergleich mit <a class="mref" href="#m01">M-01</a>
    lohnt sich: Beide Cofaktoren stabilisieren ein Carbanion mit einem positiv geladenen
    Ringstickstoff. PLP tut das an einer Aminosäure, TPP an einer α-Ketosäure. Daraus ergeben sich
    zwei völlig verschiedene Reaktionsklassen aus demselben elektronischen Prinzip. Vom Cofaktor
    ist nur der Thiazoliumring gezeichnet; „Pyrimidin“ steht für den Aminopyrimidinrest, „OPP“ für
    die Pyrophosphatkette. Bei der Decarboxylierung ist nur der Bindungsbruch als Pfeil ausgeführt.
    Der Kohlenstoff ist quartär, für einen zweiten Pfeil bleibt dort kein Platz.</figcaption>
  </figure>
