      <span class="id">M-02</span>
      <h3>Thiaminpyrophosphat und die Umpolung</h3>
    </div>
    <p class="tafel-sub">Ein Carbonylkohlenstoff ist von Natur aus elektrophil. TPP kehrt diese
    Polarität um und macht ihn zum Nucleophil, daher der Name Umpolung. Alle vier Stufen sind
    einzeln gezeichnet.</p>
  </div>

  <figure class="tafel">
    {{T:m02}}
    <figcaption><b>M-02 · Thiaminpyrophosphat.</b> Der Vergleich mit <a class="mref" href="#m01">M-01</a>
    lohnt sich: Beide Cofaktoren stabilisieren ein Carbanion mit einem positiv geladenen
    Ringstickstoff. PLP tut das an einer Aminosäure, TPP an einer α-Ketosäure. Daraus ergeben sich
    zwei völlig verschiedene Reaktionsklassen aus demselben elektronischen Prinzip. Vom Cofaktor
    ist nur der Thiazoliumring gezeichnet; „Pyrimidin“ steht für den Aminopyrimidinrest samt der
    Methylenbrücke zum Ringstickstoff, „OPP“ für die Ethylenbrücke mit der Pyrophosphatkette.
    In Zone A ist wichtig, wer das C2-Proton aufnimmt: nicht eine Base des Enzyms, die elf bis
    vierzehn pK<sub>a</sub>-Einheiten zu schwach wäre, sondern der Iminostickstoff des
    Aminopyrimidins, den die V-förmige Konformation des Cofaktors unmittelbar neben das C2 legt.
    Das Ylid entsteht damit als Zwitterion; sein Gleichgewichtsanteil bleibt winzig, stellt sich
    aber in Millisekunden ein, und das genügt kinetisch. Bei der Decarboxylierung in Zone B sind
    beide Pfeile ausgeführt: die brechende C–C-Bindung bildet die Doppelbindung zum Ring, und das
    π-Paar der C=N⁺-Bindung geht auf den Stickstoff. Nur so ist erklärt, warum der Ringstickstoff
    im Enamin neutral ist.</figcaption>
  </figure>
